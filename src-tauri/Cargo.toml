[package]
name = "coral"
version = "0.1.0"
description = "Coral — Sprite atlas & 2D animation toolkit"
authors = ["Phineas"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "coral_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Command line (same exe as the app, see src/cli.rs) and Ctrl+C for `--watch`.
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.4"
thiserror = "2.0"
rayon = "1.12"
walkdir = "2.5"
globset = "0.4"
# Watch folders (src/utils/watch.rs).
notify = "8.2"
notify-debouncer-full = "0.7"
image = { version = "0.25.6", default-features = false, features = ["png", "tga", "gif", "rayon"] }
psd = "0.3.5"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
flate2 = "1.1.10"

[dev-dependencies]
tempfile = "3"
# Mock runtime for driving the real IPC commands in tests (`src/ipc_tests.rs`).
tauri = { version = "2", features = ["protocol-asset", "test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# No panic = "abort": a crash in the third-party PSD decoder is caught per file (core/sources/psd.rs).
strip = true
